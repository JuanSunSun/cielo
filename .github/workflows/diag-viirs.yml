name: Diagnóstico Open-Meteo
# Compara los modelos que sirve Open-Meteo para Puerto Varas (nubosidad y malla). Se lanza a mano.
on: workflow_dispatch
permissions:
  contents: write
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p diag; : > diag/openmeteo.txt
          Q="latitude=-41.319&longitude=-72.985&hourly=cloud_cover,cloud_cover_low,cloud_cover_mid,cloud_cover_high&forecast_hours=12&timezone=America%2FSantiago"
          for m in default ecmwf_ifs ecmwf_ifs025 ecmwf_aifs025_single gfs_seamless icon_seamless; do
            if [ "$m" = default ]; then U="https://api.open-meteo.com/v1/forecast?$Q"; else U="https://api.open-meteo.com/v1/forecast?$Q&models=$m"; fi
            echo "== $m" >> diag/openmeteo.txt
            curl -sS "$U" | python3 -c "
          import sys, json
          j = json.load(sys.stdin)
          if 'hourly' not in j: print('ERROR', j); sys.exit()
          print('celda:', j['latitude'], j['longitude'], 'elev', j.get('elevation'))
          h = j['hourly']
          ks = [k for k in h if k.startswith('cloud_cover')]
          for k in ks: print(f'{k:24s}', h[k])
          print('tiempos', h['time'][0], '...', h['time'][-1])
          " >> diag/openmeteo.txt
          done
          cat diag/openmeteo.txt
      - run: |
          git config user.name "cielo-bot"; git config user.email "cielo-bot@users.noreply.github.com"
          git checkout --orphan diag-out
          git rm -rfq --cached .
          git add -f diag/openmeteo.txt
          git commit -qm "openmeteo"
          git push -f origin diag-out
