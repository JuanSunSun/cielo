name: Diagnóstico
# Copia el latest.json publicado a la rama diag-out para poder inspeccionarlo (se lanza a mano).
on: workflow_dispatch
permissions:
  contents: write
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: curl -fsS "https://juansunsun.github.io/cielo/data/latest.json" -o diag.json
      - run: |
          git config user.name "cielo-bot"; git config user.email "cielo-bot@users.noreply.github.com"
          git checkout --orphan diag-out
          git rm -rfq --cached .
          git add -f diag.json
          git commit -qm "diag"
          git push -f origin diag-out
