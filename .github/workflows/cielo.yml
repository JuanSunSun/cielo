name: Mapa de nubes

on:
  schedule:
    - cron: "7,22,37,52 * * * *"   # fuera de los minutos punta; GitHub puede retrasarlo
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  generar:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - id: pages
        uses: actions/configure-pages@v5

      - name: Procesar GOES-19
        run: python procesar.py --salida _site --sitio "${{ steps.pages.outputs.base_url }}"

      - name: Copiar la app
        run: cp -r app/. _site/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: despliegue
        uses: actions/deploy-pages@v4
